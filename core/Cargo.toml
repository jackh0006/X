[package]
name = "x-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "X encryption core: Argon2id + XChaCha20-Poly1305 portable text payloads"
repository = "https://github.com/jackh0006/X"
publish = false

[lib]
name = "x_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables deterministic test-vector generation. Never enabled for release builds.
fixtures = []

[[bin]]
name = "x-bench"
path = "src/bin/x-bench.rs"

[[bin]]
name = "x-fixture"
path = "src/bin/x-fixture.rs"
required-features = ["fixtures"]

[dependencies]
base64 = "0.22"
hex = "0.4"
libsodium-rs = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
proptest = "1"
