name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: core
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: core
      - name: Tests
        run: cargo test --release
        working-directory: core
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Dependency audit
        run: cargo audit
        working-directory: core
      - name: Dependency and license policy
        run: cargo deny check
        working-directory: core

  flutter:
    name: Flutter app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
      - name: Build native core for host tests
        run: cargo build --release
        working-directory: core
      - name: Dependencies
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Unit and widget tests
        run: flutter test
        working-directory: app

  linux-package:
    name: Linux DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev
      - name: Build and package
        run: |
          ./scripts/build-linux.sh
          ./scripts/build-deb.sh
      - name: Verify package
        run: |
          dpkg-deb -I dist/x_amd64.deb
          dpkg-deb -x dist/x_amd64.deb /tmp/x-extract
          test -x /tmp/x-extract/opt/x/x
          test -f /tmp/x-extract/opt/x/lib/libx_core.so
          ldd /tmp/x-extract/opt/x/x | (! grep 'not found')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-amd64-deb
          path: dist/x_amd64.deb
          if-no-files-found: error

  android-package:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build APK
        run: ./scripts/build-android.sh
      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose dist/app-release.apk
          "$BT/aapt" dump badging dist/app-release.apk | grep "package: name='com.jackh0006.x'"
          unzip -l dist/app-release.apk | grep 'lib/arm64-v8a/libx_core.so'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-arm64-apk
          path: dist/app-release.apk
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
