name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: core
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: core
      - name: Tests
        run: cargo test --release
        working-directory: core
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Dependency audit
        run: cargo audit
        working-directory: core
      - name: Dependency and license policy
        run: cargo deny check
        working-directory: core

  flutter:
    name: Flutter app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
      - name: Build native core for host tests
        run: cargo build --release
        working-directory: core
      - name: Dependencies
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Unit and widget tests
        run: flutter test
        working-directory: app

  linux-package:
    name: Linux DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev
      - name: Build and package
        run: |
          ./scripts/build-linux.sh
          ./scripts/build-deb.sh
      - name: Verify package
        run: |
          dpkg-deb -I dist/X-linux-amd64.deb
          dpkg-deb -x dist/X-linux-amd64.deb /tmp/x-extract
          test -x /tmp/x-extract/opt/x/x
          test -f /tmp/x-extract/opt/x/lib/libx_core.so
          ldd /tmp/x-extract/opt/x/x | (! grep 'not found')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: X-linux-amd64
          path: dist/X-linux-amd64.deb
          if-no-files-found: error

  android-package:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Install Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build APK
        run: ./scripts/build-android.sh
      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose dist/X-android-universal.apk
          "$BT/aapt" dump badging dist/X-android-universal.apk | grep "package: name='com.jackh0006.x'"
          unzip -l dist/X-android-universal.apk | grep 'lib/arm64-v8a/libx_core.so'
          unzip -l dist/X-android-universal.apk | grep 'lib/armeabi-v7a/libx_core.so'
          unzip -l dist/X-android-universal.apk | grep 'lib/x86_64/libx_core.so'
          bash scripts/no_network_check.sh dist/X-android-universal.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: X-android-universal
          path: dist/X-android-universal.apk
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
