name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Install system and Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/x-release.jks"
          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/x-release.jks
          EOF
      - name: Run release tests
        run: |
          cd core
          cargo fmt --all -- --check
          cargo test --release
          cargo build --release
          cd ../app
          flutter pub get
          flutter analyze
          flutter test
      - name: Build core, DEB, and signed APK
        run: |
          ./scripts/build-linux.sh
          ./scripts/build-deb.sh
          ./scripts/build-android.sh
          cd app/android && ./gradlew --stop || true
      - name: Generate source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="X-${GITHUB_REF_NAME#v}/" \
            -o "dist/X-${GITHUB_REF_NAME#v}-source.tar.gz" \
            "$GITHUB_REF_NAME"
      - name: Verify signed APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose dist/X-android-universal.apk
          "$BT/aapt" dump badging dist/X-android-universal.apk | grep "package: name='com.jackh0006.x'"
          unzip -l dist/X-android-universal.apk | grep 'lib/arm64-v8a/libx_core.so'
          unzip -l dist/X-android-universal.apk | grep 'lib/armeabi-v7a/libx_core.so'
          unzip -l dist/X-android-universal.apk | grep 'lib/x86_64/libx_core.so'
          bash scripts/no_network_check.sh dist/X-android-universal.apk
          dpkg-deb -I dist/X-linux-amd64.deb
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/X-android-universal.apk
            dist/X-linux-amd64.deb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo '## SHA-256 checksums'
            echo '```'
            cd dist
            sha256sum X-android-universal.apk X-linux-amd64.deb "X-${GITHUB_REF_NAME#v}-source.tar.gz"
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"
          cd "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" \
            --title "X v${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/X-android-universal.apk \
            dist/X-linux-amd64.deb \
            "dist/X-${GITHUB_REF_NAME#v}-source.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x-release-artifacts
          path: |
            dist/X-android-universal.apk
            dist/X-linux-amd64.deb
            dist/X-*-source.tar.gz
