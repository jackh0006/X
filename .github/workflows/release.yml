name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - name: Install system and Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/x-release.jks"
          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/x-release.jks
          EOF
      - name: Run release tests
        run: |
          cd core
          cargo fmt --all -- --check
          cargo test --release
          cargo build --release
          cd ../app
          flutter pub get
          flutter analyze
          flutter test
      - name: Build core, DEB, and signed APK
        run: |
          ./scripts/build-linux.sh
          ./scripts/build-deb.sh
          ./scripts/build-android.sh
          cd app/android && ./gradlew --stop || true
      - name: Generate SBOM and checksums
        run: |
          SBOM="$(python3 scripts/generate_sbom.py | tail -1)"
          echo "SBOM=$SBOM" >> "$GITHUB_ENV"
          cd dist
          sha256sum app-release.apk x_amd64.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Verify signed APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose dist/app-release.apk
          "$BT/aapt" dump badging dist/app-release.apk | grep "package: name='com.jackh0006.x'"
          unzip -l dist/app-release.apk | grep 'lib/arm64-v8a/libx_core.so'
          dpkg-deb -I dist/x_amd64.deb
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/app-release.apk
            dist/x_amd64.deb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "X ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md \
            dist/app-release.apk \
            dist/x_amd64.deb \
            dist/SHA256SUMS \
            "$SBOM" \
            docs/TEST_RESULTS.md \
            docs/SECURITY_ASSESSMENT.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x-release-artifacts
          path: |
            dist/app-release.apk
            dist/x_amd64.deb
            dist/SHA256SUMS
            dist/x-*.cdx.json
